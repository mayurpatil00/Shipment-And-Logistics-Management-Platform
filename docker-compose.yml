services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-app
    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/logistics_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Mayur07@patil

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-dev-only-secret-please-32bytes+}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-3600000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${APP_JWT_REFRESH_EXPIRATION_MS:-604800000}

      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@logistics.local}
      APP_ADMIN_DEFAULT_PASSWORD: ${APP_ADMIN_DEFAULT_PASSWORD:-mayurpatil07}

      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

    depends_on:
      mysql-db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: logistics-mysql

    environment:
      MYSQL_DATABASE: logistics_db
      MYSQL_ROOT_PASSWORD: Mayur07@patil

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: logistics-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  mysql-data:
  redis-data: